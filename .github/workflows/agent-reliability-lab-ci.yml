name: Agent Reliability Lab

on:
  push:
    branches: [main]
    paths:
      - "agent-reliability-lab/**"
      - ".github/workflows/agent-reliability-lab-ci.yml"
  pull_request:
    paths:
      - "agent-reliability-lab/**"
      - ".github/workflows/agent-reliability-lab-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ""
      - name: Verify all six labs
        working-directory: agent-reliability-lab
        run: npm test
